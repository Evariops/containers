# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# ------------------------------------------------------------------
# SPDK Container Images — Build, Scan, Sign, Publish
# ------------------------------------------------------------------
# Produces two images from the same Dockerfile:
#   - ghcr.io/evariops/spdk        (scratch, production)
#   - ghcr.io/evariops/spdk-debug  (Fedora, shell + tooling)
#
# Debug builds run AFTER prod to reuse shared registry cache.
# ------------------------------------------------------------------
name: SPDK

on:
  push:
    branches: [main]
    tags: ["spdk/v*"]
    paths:
      - "images/spdk/**"
      - ".github/workflows/spdk.yml"
  pull_request:
    paths:
      - "images/spdk/**"
      - ".github/workflows/spdk.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/evariops/spdk
  IMAGE_NAME_DEBUG: ghcr.io/evariops/spdk-debug

permissions:
  contents: read

concurrency:
  group: spdk-${{ github.ref }}
  cancel-in-progress: true

# ==================================================================
jobs:
  # ────────────────────────────────────────────────────────────────
  # 1. Lint
  # ────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: images/spdk/Dockerfile
          config: images/spdk/.hadolint.yaml

  # ────────────────────────────────────────────────────────────────
  # 2. Build prod (scratch) — amd64 + arm64
  # ────────────────────────────────────────────────────────────────
  build:
    needs: lint
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      minor_tag: ${{ steps.tag.outputs.minor_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/spdk/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/spdk/}"
            if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "minor_tag=${TAG%.*}" >> "$GITHUB_OUTPUT"
            fi
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: images/spdk
          file: images/spdk/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:cache-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:cache-{1},mode=max', env.IMAGE_NAME, matrix.arch) || '' }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ startsWith(github.ref, 'refs/tags/') && format('{0}:{1}-{2}', env.IMAGE_NAME, steps.tag.outputs.tag, matrix.arch) || steps.build.outputs.imageid }}
          format: "table"
          exit-code: "1"
          severity: "HIGH,CRITICAL"

  # ────────────────────────────────────────────────────────────────
  # 3. Build debug (Fedora) — amd64 + arm64
  #    Runs after prod to pull shared layers from registry cache.
  # ────────────────────────────────────────────────────────────────
  build-debug:
    needs: build
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build debug (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: images/spdk
          file: images/spdk/Dockerfile
          target: debug
          platforms: ${{ matrix.platform }}
          build-args: BUILD_TYPE=debug
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ env.IMAGE_NAME_DEBUG }}:${{ needs.build.outputs.tag }}-${{ matrix.arch }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE_NAME_DEBUG }}:cache-${{ matrix.arch }}
            type=registry,ref=${{ env.IMAGE_NAME }}:cache-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:cache-{1},mode=max', env.IMAGE_NAME_DEBUG, matrix.arch) || '' }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ startsWith(github.ref, 'refs/tags/') && format('{0}:{1}-{2}', env.IMAGE_NAME_DEBUG, needs.build.outputs.tag, matrix.arch) || steps.build.outputs.imageid }}
          format: "table"
          exit-code: "1"
          severity: "HIGH,CRITICAL"

  # ────────────────────────────────────────────────────────────────
  # 4. Publish — multi-arch manifest + Sign + SBOM + Attest
  #    Runs once per variant (prod / debug).
  # ────────────────────────────────────────────────────────────────
  publish:
    needs: [build, build-debug]
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - variant: prod
            image: ghcr.io/evariops/spdk
          - variant: debug
            image: ghcr.io/evariops/spdk-debug
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # cosign keyless (Fulcio OIDC)
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Create and push multi-arch manifest
        id: manifest
        env:
          TAG: ${{ needs.build.outputs.tag }}
          MINOR_TAG: ${{ needs.build.outputs.minor_tag }}
          IMG: ${{ matrix.image }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            -t "${IMG}:${TAG}" \
            "${IMG}:${TAG}-amd64" \
            "${IMG}:${TAG}-arm64"

          if [[ -n "${MINOR_TAG}" ]]; then
            docker buildx imagetools create \
              -t "${IMG}:${MINOR_TAG}" \
              "${IMG}:${TAG}-amd64" \
              "${IMG}:${TAG}-arm64"
          fi

          SHA_TAG="sha-${GITHUB_SHA::7}"
          docker buildx imagetools create \
            -t "${IMG}:${SHA_TAG}" \
            "${IMG}:${TAG}-amd64" \
            "${IMG}:${TAG}-arm64"

          DIGEST=$(docker buildx imagetools inspect "${IMG}:${TAG}" --raw | sha256sum | awk '{print "sha256:"$1}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Manifest digest: ${DIGEST}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      - name: Sign image
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          cosign sign --yes "${{ matrix.image }}@${DIGEST}"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@57aae528053a48a3f6235f2d9461b05fbcb7366d # v0.23.1
        with:
          image: ${{ matrix.image }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-artifact-retention: 90
          artifact-name: sbom-${{ matrix.variant }}-spdx

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@57aae528053a48a3f6235f2d9461b05fbcb7366d # v0.23.1
        with:
          image: ${{ matrix.image }}@${{ steps.manifest.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
          upload-artifact-retention: 90
          artifact-name: sbom-${{ matrix.variant }}-cdx

      - name: Checkout (for scripts)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          path: repo

      - name: Enrich SBOMs
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          VER="${TAG#v}"; VER="${VER%.*}"
          ./repo/.github/scripts/enrich-sbom.sh \
            --name spdk \
            --version "$VER" \
            --supplier "SPDK Project (Linux Foundation)" \
            --license "BSD-3-Clause" \
            --purl "pkg:github/spdk/spdk@v${VER}" \
            --download "https://github.com/spdk/spdk/archive/refs/tags/v${VER}.tar.gz" \
            --vcs "https://github.com/spdk/spdk" \
            --spdx sbom.spdx.json \
            --cdx sbom.cdx.json

      - name: Attest SBOM
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${{ matrix.image }}@${DIGEST}"
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "${{ matrix.image }}@${DIGEST}"
